section_notes:
- section: Μαθήματα που προσφέρονται από το Τμήμα Πληροφορικής και Τηλεπικοινωνιών του ΕΚΠΑ
  text: Η εκδήλωση ενδιαφέροντος για την παρακολούθηση των παρακάτω μαθημάτων στο Τμήμα Πληροφορικής και Τηλεπικοινωνιών (ΤΠΤ) γίνεται με αίτηση των ενδιαφερομένων φοιτητών και μετά από σχετικό κάλεσμα στην ιστοσελίδα του Τμήματος Μαθηματικών. Το κάλεσμα αναρτάται μόλις γίνει διαθέσιμο το Ωρολόγιο Πρόγραμμα του ΤΠΤ για το Χειμερινό Εξάμηνο. Οι αιτήσεις εξετάζονται από επιτροπή. Η λίστα με την αντιστοιχία φοιτητών και μαθημάτων καταρτίζεται βάση κριτηρίων και προϋποθέσεων που αναφέρονται στο σχετικό κάλεσμα. Στη συνέχεια η λίστα εγκρίνεται από την Γενική Συνέλευση και ανακοινώνεται στην ιστοσελίδα του Τμήματος. Τα μαθήματα διδάσκονται στους χώρους του Τμήματος Πληροφορικής του ΕΚΠΑ.
