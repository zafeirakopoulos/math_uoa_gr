Επίκουρος Καθηγητής:
  el: { m: Επίκουρος Καθηγητής, f: Επίκουρη Καθηγήτρια }
  en: { m: Assistant Professor, f: Assistant Professor }
Λέκτορας:
  el: { m: Λέκτορας, f: Λέκτορας }
  en: { m: Lecturer, f: Lecturer }
Ομότιμος Καθηγητής:
  el: { m: Ομότιμος Καθηγητής, f: Ομότιμη Καθηγήτρια }
