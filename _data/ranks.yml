# Academic ranks. The key is the value of `rank:` in collections/_people/*.md;
# the label shown depends on the page language and the person's `gender` (m by default, f).
Καθηγητής:
  el: { m: Καθηγητής, f: Καθηγήτρια }
  en: { m: Professor, f: Professor }
Αναπληρωτής Καθηγητής:
  el: { m: Αναπληρωτής Καθηγητής, f: Αναπληρώτρια Καθηγήτρια }
