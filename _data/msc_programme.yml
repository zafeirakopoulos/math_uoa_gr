  teaching: Διά ζώσης
  min_enrolment_for_elective: 3
  grading: Ακέραιος βαθμός 0–10, βάση το 5.
  exam_periods: Στο τέλος του εξαμήνου διδασκαλίας (χειμερινό ή εαρινό) και επαναληπτική εξέταση πριν από την έναρξη του επόμενου ακαδημαϊκού έτους.
  special_topics_coding: Στους κωδικούς Ειδικών Θεμάτων (Θχψ.α, Εχψ.α) το χψ δηλώνει το ακαδημαϊκό έτος πρώτης προσφοράς και το α (α έως ω) το συγκεκριμένο μάθημα· π.χ. Θ22.β είναι το δεύτερο τέτοιο μάθημα που προσφέρθηκε πρώτη φορά το 2022-2023.
  recognition_max: 2
  from_other_programmes_max: 2
  from_other_programmes_condition: Επιτυχής εξέταση σε τουλάχιστον πέντε (5) μαθήματα του Π.Μ.Σ. και προηγούμενη άδεια της Επιτροπής Παρακολούθησης της ειδίκευσης.
thesis:
  required: true
  ects: 30
  semester: 4
  supervisor_chosen: Μετά το τέλος του δεύτερου εξαμήνου σπουδών.
  committee: Τριμελής εξεταστική επιτροπή (τουλάχιστον ένα μέλος Δ.Ε.Π. του Τμήματος Μαθηματικών).
  language: Ελληνικά (με εκτενή περίληψη στα Αγγλικά) ή Αγγλικά (με εκτενή περίληψη στα Ελληνικά).
  presentation: Δημόσια παρουσίαση ενώπιον της τριμελούς επιτροπής, μετά την επιτυχή εξέταση σε όλα τα απαιτούμενα μαθήματα.
  grade_scale: 5–10
  repository: Πέργαμος
degree_grade: Σταθμισμένος μέσος όρος των βαθμών των μαθημάτων και της διπλωματικής εργασίας με βάρη τις πιστωτικές μονάδες.
admission:
  max_students: 55
  call: Κάθε Μάιο, με προκήρυξη στην ιστοσελίδα του Τμήματος και του ΕΚΠΑ.
  eligibility: Πτυχιούχοι Α.Ε.Ι. της ημεδαπής ή ομοταγών ιδρυμάτων της αλλοδαπής με επαρκές μαθηματικό υπόβαθρο, καθώς και τελειόφοιτοι που ολοκληρώνουν το πτυχίο έως και την εξεταστική του Σεπτεμβρίου.
  stages: Δύο στάδια· το πρώτο (Δέσμη Α) ολοκληρώνεται έως το τέλος Ιουλίου, το δεύτερο (Δέσμη Β και εκκρεμείς περιπτώσεις) τον Σεπτέμβριο.
  criteria_a: Βαθμολογία σε 11 προπτυχιακά μαθήματα, βαθμός πτυχίου (×2), υποχρεωτική συνέντευξη (0–40 μονάδες), γνώση Αγγλικών, συστατικές επιστολές.
  criteria_b: Γραπτές εξετάσεις σε δύο ενότητες (η μία της ειδίκευσης), βαθμός πτυχίου (×2), συνέντευξη, γνώση Αγγλικών, συστατικές επιστολές.
  exam_units:
    - Άλγεβρα και Γεωμετρία
    - Ανάλυση
    - Πιθανότητες και Στατιστική
    - Διαφορικές Εξισώσεις και Αριθμητική Ανάλυση
  english: Απαιτείται επαρκής γνώση Αγγλικών· γραπτή εξέταση (μετάφραση μαθηματικού κειμένου), με δυνατότητα εξαίρεσης για κατόχους διπλώματος επιπέδου Β2 και άνω.
  documents:
    - Αίτηση συμμετοχής
    - Αντίγραφα τίτλων σπουδών
    - Αναγνώριση από τον ΔΟΑΤΑΠ (για τίτλους της αλλοδαπής)
    - Πιστοποιητικό αναλυτικής βαθμολογίας
    - Βιογραφικό σημείωμα
    - Αντίγραφο ταυτότητας ή διαβατηρίου
    - Στοιχεία δύο συντακτών συστατικών επιστολών (οι επιστολές αποστέλλονται από τους ίδιους στο secr@math.uoa.gr)
    - Πιστοποιητικό γνώσης Αγγλικών επιπέδου Β2
    - Μία πρόσφατη φωτογραφία τύπου διαβατηρίου
    - Υπεύθυνη δήλωση μέσω gov.gr για τη γνησιότητα των στοιχείων
